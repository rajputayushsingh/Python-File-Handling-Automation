<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>File Organizer</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background: #f2f4f7;
            text-align: center;
            padding-top: 100px;
        }

        .container {
            background: white;
            width: 500px;
            margin: auto;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.15);
        }

        h1 {
            margin-bottom: 20px;
        }

        button {
            background: #007bff;
            color: white;
            border: none;
            padding: 14px 25px;
            border-radius: 7px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background: #0056b3;
        }

        .message {
            margin-top: 20px;
            color: green;
            font-weight: bold;
        }

    </style>

</head>

<body>

    <div class="container">

        <h1>📁 File Organizer</h1>

        <p>
            Automatically organize files into categories.
        </p>

        <form method="POST">

            <button type="submit">
                Organize Files
            </button>

        </form>

        {% if message %}

        <div class="message">
            {{ message }}
        </div>

        {% endif %}

    </div>

</body>

</html>
